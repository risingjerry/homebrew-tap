name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Register and trust the checked-out tap
        run: |
          brew tap risingjerry/tap "$GITHUB_WORKSPACE"
          brew trust --tap risingjerry/tap

      - name: Audit Formula and Cask
        run: |
          brew style risingjerry/tap
          brew audit --strict risingjerry/tap/agent-switch-cli
          brew audit --cask --strict risingjerry/tap/agent-switch

      - name: Install and test CLI
        run: |
          brew install risingjerry/tap/agent-switch-cli
          brew test risingjerry/tap/agent-switch-cli
          agent-switch --version

      - name: Install and validate macOS app
        run: |
          brew install --cask risingjerry/tap/agent-switch
          test -d "/Applications/Agent Switch.app"
          if xattr -p com.apple.quarantine "/Applications/Agent Switch.app"; then
            echo "Gatekeeper quarantine was not removed" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "/Applications/Agent Switch.app"
          lipo -archs "/Applications/Agent Switch.app/Contents/MacOS/Agent Switch" \
            | grep arm64
          lipo -archs "/Applications/Agent Switch.app/Contents/MacOS/Agent Switch" \
            | grep x86_64

  public-install:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    steps:
      - name: Run the public README install command
        run: brew tap risingjerry/tap && brew trust --tap risingjerry/tap && brew install --cask risingjerry/tap/agent-switch

      - name: Verify the public installation
        run: |
          agent-switch --version
          test -d "/Applications/Agent Switch.app"
          if xattr -p com.apple.quarantine "/Applications/Agent Switch.app"; then
            echo "Gatekeeper quarantine was not removed" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "/Applications/Agent Switch.app"
